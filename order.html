<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Project | Joki Tugas Lampung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 800: '#1e40af', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-brand-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white dark:bg-gray-800 shadow-md fixed w-full z-10 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="text-2xl font-bold text-brand-600 dark:text-brand-500">
                        <i class="bi bi-journal-check"></i> JokiTugas<span class="text-gray-800 dark:text-white">Lampung</span>
                    </a>
                    <a href="index.html" class="hidden md:block hover:text-brand-600 dark:hover:text-brand-400 font-semibold transition">Beranda</a>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                        <i class="bi bi-moon-fill dark:hidden"></i>
                        <i class="bi bi-sun-fill hidden dark:block text-yellow-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Order Form Section -->
    <section class="pt-28 pb-12 px-4 sm:px-6 lg:px-8 flex-grow">
        <div class="max-w-3xl mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 fade-in-up border-t-4 border-brand-500">
            <h1 class="text-3xl font-bold text-center mb-2 text-gray-900 dark:text-white">Formulir Pemesanan</h1>
            <p class="text-center text-gray-500 dark:text-gray-400 mb-8">Lengkapi detail project atau tugas yang ingin Anda percayakan kepada kami.</p>
            
           <form id="formOrder" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label class="block text-sm font-medium mb-1">Nama Lengkap / Samaran</label>
            <input type="text" id="nama" required class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 border-transparent focus:border-brand-500 focus:bg-white dark:focus:bg-gray-600 focus:ring-0 transition" placeholder="Contoh: Budi">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Kategori Tugas</label>
            <select id="kategori" class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 border-transparent focus:border-brand-500 focus:bg-white dark:focus:bg-gray-600 focus:ring-0 transition">
                <option>Tugas Sekolah</option>
                <option>Tugas Kuliah (Makalah/Skripsi)</option>
                <option>Olah Data (SPSS/NVivo)</option>
                <option>Pembuatan Aplikasi / Web</option>
                <option>EA Trading</option>
            </select>
        </div>
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Deadline / Tenggat Waktu</label>
        <input type="date" id="deadline" required class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 border-transparent focus:border-brand-500 focus:bg-white dark:focus:bg-gray-600 focus:ring-0 transition">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Deskripsi Detail Project</label>
        <textarea id="deskripsi" required rows="4" class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 border-transparent focus:border-brand-500 focus:bg-white dark:focus:bg-gray-600 focus:ring-0 transition" placeholder="Jelaskan spesifikasi tugas..."></textarea>
    </div>

    <!-- Tambahkan id="btnSubmit" pada tombol -->
    <button type="submit" id="btnSubmit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition transform hover:-translate-y-1">
        <i class="bi bi-send-fill"></i> Pesan Sekarang
    </button>
</form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm mt-auto">
        <p>&copy; 2026 Joki Tugas Lampung. All rights reserved.</p>
    </footer>

    <!-- Animations & Theme Script -->
    <script>
        // Dark Mode Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            themeToggleBtn.querySelector('.bi-moon-fill').classList.toggle('hidden');
            themeToggleBtn.querySelector('.bi-sun-fill').classList.toggle('hidden');
        });

        // Scroll Animation
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        });
        document.querySelectorAll('.fade-in-up').forEach((el) => observer.observe(el));
    </script>
    <script>
    document.getElementById('formOrder').addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah web me-reload

        // 1. Ganti dengan nomor Admin Anda (Gunakan awalan 62 tanpa +)
        const nomorAdmin = "62895327022005"; 

        // 2. Mengambil data yang diisi pelanggan dari form
        const nama = document.getElementById('nama').value;
        const kategori = document.getElementById('kategori').value;
        const deadline = document.getElementById('deadline').value;
        const deskripsi = document.getElementById('deskripsi').value;

        // 3. Menyusun format pesan yang akan muncul di WA pelanggan
        const teksPesan = `Halo Admin Joki Tugas Lampung! 👋\n\nSaya ingin memesan jasa joki dengan detail berikut:\n\n*Nama:* ${nama}\n*Kategori Tugas:* ${kategori}\n*Deadline:* ${deadline}\n*Deskripsi Tugas:*\n_${deskripsi}_\n\nMohon informasi ketersediaan dan total biayanya ya kak. Terima kasih!`;

        // 4. Mengubah teks menjadi format URL (agar spasi dan enter terbaca di WA)
        const teksEncode = encodeURIComponent(teksPesan);

        // 5. Membuat link WhatsApp (wa.me)
        const linkWA = `https://wa.me/${nomorAdmin}?text=${teksEncode}`;

        // 6. Mengarahkan browser pelanggan ke aplikasi WhatsApp
        window.open(linkWA, '_blank'); 
        
        // (Opsional) Mengosongkan form setelah dialihkan
        document.getElementById('formOrder').reset();
    });
</script>
</body>
</html>
